<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000091">
<title>Conseillers de presse — Annuaire</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  /*
    Palette et typographie conformes à la charte graphique de l'État /
    Système de Design de l'État (DSFR) — cf. systeme-de-design.gouv.fr
    Bleu France #000091, Rouge Marianne #E1000F.

    Police Marianne : ressource sous licence, réservée aux administrations.
    Déclarez ici vos fichiers auto-hébergés (woff2) si vous disposez de la
    licence ; à défaut, la pile de secours ci-dessous s'applique.
  */
  @font-face{
    font-family:"Marianne";
    src: local("Marianne"); /* remplacer par url("./fonts/Marianne-Regular.woff2") format("woff2") si auto-hébergée */
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"Marianne";
    src: local("Marianne Bold");
    font-weight:700;
    font-display:swap;
  }

  :root{
    --blue-france:      #000091;
    --blue-france-hover:#1212FF;
    --blue-france-active:#2323FF;
    --blue-france-975:  #F5F5FE;
    --blue-france-950:  #ECECFE;
    --blue-france-925:  #E3E3FD;
    --red-marianne:      #E1000F;
    --red-marianne-hover:#FF292F;
    --red-marianne-975:  #FEF4F4;
    --grey-text:    #161616;
    --grey-muted:   #666666;
    --grey-border:  #DDDDDD;
    --grey-bg-alt:  #F6F6F6;
    --white:#FFFFFF;
    --radius:4px;
    font-family:"Marianne","Segoe UI",Arial,ui-sans-serif,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--grey-bg-alt);color:var(--grey-text);height:100%;}
  body{font-size:14px;line-height:1.5;}
  a{color:var(--blue-france);}

  /* ============================================================
     Composant En-tête officiel du DSFR (extrait tel quel de
     @gouvfr/dsfr v1.15.2 — fr-header / fr-logo). C'est le même
     bloc-marque que celui utilisé sur diplomatie.gouv.fr : le
     pictogramme et le mot-symbole "RÉPUBLIQUE FRANÇAISE" sont
     dessinés par les ::before/::after ci-dessous (SVG officiels),
     le nom du ministère est le texte du <p class="fr-logo">.
     ============================================================ */
  .fr-header {
    --underline-img: none;
    --ul-type: none;
    --ol-type: none;
    --ul-start: 0;
    --ol-start: 0;
    --xl-block: 0;
    --li-bottom: 0;
    --ol-content: none;
    --text-spacing: 0;
    --title-spacing: 0;
    width: 100%;
    position: relative;
  }

  .fr-header__body-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    margin: 0 -1rem;
  }

  .fr-header__brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    width: 100%;
    padding-left: 0.25rem;
    padding-right: 0.25rem;
    z-index: calc(0 + 750);
    background-color: #fff;

    --idle: transparent;
    --hover: rgba(0,0,18,.05);
    --active: rgba(0,0,18,.1);
    filter: drop-shadow(0 1px 3px rgba(0,0,18,.16));
  }

  .fr-header__brand::after {
    content: "";
    display: block;
    position: relative;
    z-index: 1;
    flex: 1;
    align-self: stretch;
  }

  .fr-header__brand-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    overflow: hidden;
  }

  .fr-header__logo {
    order: 1;
    flex: 0 0 auto;
    padding: 0.75rem;
  }

  .fr-logo {
    --text-spacing: 0;
    --underline-img: none;
    display: inline-block;
    font-weight: 700;
    line-height: 1.0317460317em;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    vertical-align: middle;
    text-indent: -0.1em;
    font-size: 1.05rem;
    color: #000;
  }

  .fr-header__logo .fr-logo {
    font-size: 0.7875rem;
    padding: 0.75rem;
    margin: -0.75rem;
  }

  .fr-header__logo .fr-logo::before {
    width: 2.0625rem;
    height: 0.75rem;
    margin-bottom: 0.25rem;
    background-size: 2.0625rem 0.84375rem, 2.0625rem 0.75rem, 0;
    background-position: 0 -0.046875rem, 0 0, 0 0;
  }

  .fr-header__logo .fr-logo::after {
    min-width: 1.96875rem;
    background-size: 3.9375rem 2.8125rem;
    background-position: 0 calc(100% + 1.40625rem);
    padding-top: 1.65625rem;
  }

  .fr-header__service {
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    margin-left: 0.75rem;
    margin-right: 0.75rem;
    --external-link-content: none;
    color: #161616;
  }

  .fr-header__service::before {
    content: "";
    display: block;
    width: calc(100% - 2rem);
    height: 1px;
    position: absolute;
    transform: translateY(-0.75rem);
    background-color: #ddd;

    --idle: transparent;
    --hover: #c9c9c9;
    --active: #b6b6b6;
  }

  .fr-header__service-title {
    font-weight: 700;
    font-size: 1.125rem;
    line-height: 1.5rem;
  }

  .fr-header__service-tagline {
    font-size: 0.875rem;
    line-height: 1.5rem;
  }

  .fr-header__body{ background:#fff; border-bottom:1px solid var(--grey-border); }
  .fr-container{ padding-left:1rem; padding-right:1rem; }

  /* En-tête sur une seule ligne : bloc-marque à gauche, recherche à droite */
  .fr-header__body-row{ flex-wrap:wrap; justify-content:space-between; align-items:flex-start; padding:1.25rem 0; }
  .fr-header__brand{
    flex:0 1 auto; width:auto; flex-wrap:nowrap;
    background:transparent; filter:none; z-index:auto;
    margin-top:-1rem; margin-bottom:-1rem;
    align-items:flex-start;
  }
  .fr-header__brand-top{ width:auto; }
  .fr-header__brand::after{ display:none; }
  .fr-header__logo{ padding:.75rem .75rem .75rem 0; }
  .fr-header__service::before{ content:none; }
  .fr-header__service{ margin-left:1.5rem; padding-top:.9rem; }
  .fr-header__service-title{
    font-size:1.75rem; line-height:1.2; font-weight:700; color:#161616;
    white-space:nowrap;
  }

  /* Devise "Liberté Égalité Fraternité" — affichée en clair sous l'intitulé du
     ministère, comme sur diplomatie.gouv.fr (le mot-symbole ::after du DSFR,
     lui, reste minuscule et sert plutôt de filigrane). */
  .fr-logo-devise{
    font-family:"Spectral","Georgia","Times New Roman",serif;
    font-style:italic;
    font-size:11px;
    line-height:1.3;
    font-weight:400;
    color:#161616;
    margin:2px 0 0;
  }


  /* ---------- Composant officiel : Barre de recherche (fr-search-bar) ----------
     Extrait de @gouvfr/dsfr v1.15.2 (search.css + bases fr-input / fr-btn) ---------- */
  .fr-input {
    display: block;
    width: 100%;
    border-radius: 0.25rem 0.25rem 0 0;
    font-size: 1rem;
    line-height: 1.5rem;
    padding: 0.5rem 1rem;
    color: #3a3a3a;
    background-color: #eee;
    box-shadow: inset 0 -2px 0 0 #3a3a3a;
    font-family: inherit;
    border: none;
  }
  .fr-btn {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    width: fit-content;
    font-weight: 500;
    font-size: 1rem;
    line-height: 1.5rem;
    min-height: 2.5rem;
    padding: 0.5rem 1rem;
    background-color: #000091;
    color: #f5f5fe;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .fr-search-bar {
    display: flex;
    flex-direction: row;
  }
  .fr-search-bar .fr-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    display: block;
  }
  .fr-search-bar .fr-input {
    margin: 0;
    border-radius: 0.25rem 0 0;
    max-height: 2.5rem;
    box-shadow: inset 0 -2px 0 0 #000091;
  }
  .fr-search-bar .fr-input::placeholder { font-style: italic; }
  .fr-search-bar .fr-btn {
    font-size: 1rem;
    line-height: 1.5rem;
    min-height: 2.5rem;
    padding: 0.5rem 1rem;
    overflow: hidden;
    white-space: nowrap;
    max-width: 2.5rem;
    max-height: 2.5rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    flex: 1 0 auto;
    border-radius: 0 0.25rem 0 0;
  }
  .fr-search-bar .fr-btn::before {
    --icon-size: 1.5rem;
    margin-left: 0;
    margin-right: 0.5rem;
    flex: 0 0 auto;
    display: inline-block;
    background-color: currentColor;
    width: var(--icon-size);
    height: var(--icon-size);
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Cpath%20d%3D%22m18.031%2016.617%204.283%204.282-1.415%201.415-4.282-4.283A8.96%208.96%200%200%201%2011%2020c-4.968%200-9-4.032-9-9s4.032-9%209-9%209%204.032%209%209a8.96%208.96%200%200%201-1.969%205.617Zm-2.006-.742A6.977%206.977%200%200%200%2018%2011c0-3.868-3.133-7-7-7-3.868%200-7%203.132-7%207%200%203.867%203.132%207%207%207a6.977%206.977%200%200%200%204.875-1.975l.15-.15Z%22/%3E%3C/svg%3E");
    mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Cpath%20d%3D%22m18.031%2016.617%204.283%204.282-1.415%201.415-4.282-4.283A8.96%208.96%200%200%201%2011%2020c-4.968%200-9-4.032-9-9s4.032-9%209-9%209%204.032%209%209a8.96%208.96%200%200%201-1.969%205.617Zm-2.006-.742A6.977%206.977%200%200%200%2018%2011c0-3.868-3.133-7-7-7-3.868%200-7%203.132-7%207%200%203.867%203.132%207%207%207a6.977%206.977%200%200%200%204.875-1.975l.15-.15Z%22/%3E%3C/svg%3E");
    content: "";
  }

  /* ---------- Barre d'outils : bloc-marque + service à gauche, recherche à droite ---------- */
  .fr-header__tools{
    display:flex; align-items:center; margin-left:auto;
    padding:.75rem 1rem;
  }
  .fr-header__tools .fr-search-bar{ width:100%; max-width:24rem; min-width:16rem; }


  .count{
    font-size:12.5px; color:var(--grey-muted); font-weight:600; white-space:nowrap;
    margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--grey-border);
  }

  .layout{
    display:flex;
    align-items:flex-start;
    min-height:calc(100vh - 60px);
  }

  /* ---------- Filtres ---------- */
  .filters{
    width:250px;
    flex:0 0 250px;
    background:var(--white);
    border-right:1px solid var(--grey-border);
    padding:16px 16px 24px;
    position:sticky;
    top:0;
    max-height:calc(100vh - 60px);
    overflow-y:auto;
  }
  .filter-block{margin-bottom:20px;}
  .filter-block h3{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--grey-muted);
    margin:0 0 8px;
    font-weight:700;
  }
  .chiprow{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    border:1px solid var(--grey-border);
    background:var(--grey-bg-alt);
    color:var(--grey-text);
    padding:5px 10px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
    user-select:none;
    transition:background .12s, color .12s, border-color .12s;
    font-family:inherit;
  }
  .chip:hover{border-color:#B7B7B7;}
  .chip.active{
    background:var(--blue-france);
    border-color:var(--blue-france);
    color:#fff;
  }
  .chip:focus-visible{outline:2px solid var(--blue-france); outline-offset:1px;}
  .chip .n{opacity:.65; margin-left:4px; font-size:11px;}
  .chip.active .n{opacity:.85;}

  select, .combo input{
    width:100%;
    padding:7px 9px;
    border:1px solid var(--grey-border);
    border-radius:var(--radius);
    font-size:13px;
    background:#fff;
    color:var(--grey-text);
    font-family:inherit;
  }
  .combo input:focus{outline:2px solid var(--blue-france); outline-offset:1px;}
  .combo{position:relative;}
  .combo-list{
    position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0;
    background:#fff; border:1px solid var(--grey-border); border-radius:var(--radius);
    max-height:220px; overflow-y:auto; box-shadow:0 8px 20px rgba(0,0,20,.12);
    display:none;
  }
  .combo-list.open{display:block;}
  .combo-list div{padding:7px 10px; font-size:13px; cursor:pointer;}
  .combo-list div:hover{background:var(--blue-france-975);}
  .combo-list div.sel{font-weight:700; color:var(--blue-france); background:var(--blue-france-975);}

  .toggle3{display:flex; gap:6px; flex-wrap:wrap;}
  .toggle3 .chip{min-width:52px; text-align:center;}

  .clearbtn{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:2px; font-size:12.5px; color:var(--blue-france);
    background:none; border:none; cursor:pointer; padding:0; text-decoration:underline;
    font-family:inherit;
  }
  .clearbtn:hover{color:var(--blue-france-hover);}

  /* ---------- Résultats ---------- */
  .results{
    flex:1;
    padding:18px 22px 40px;
    min-width:0;
  }
  .group{
    background:var(--white);
    border:1px solid var(--grey-border);
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
  }
  .group-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:11px 16px;
    background:var(--blue-france);
    color:#fff;
  }
  .group-head .post-title{font-weight:700; font-size:13.5px;}
  .group-head .post-sub{font-size:12px; color:var(--blue-france-925);}
  .group-head .badges{margin-left:auto; display:flex; gap:5px;}
  .badge{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:3px;
    letter-spacing:.03em;
  }
  .badge.g7{background:#fff; color:var(--blue-france);}
  .badge.g20{background:var(--red-marianne); color:#fff;}
  .badge.ue{background:#FFCC00; color:#161616;}

  table.people{width:100%; border-collapse:collapse;}
  table.people td, table.people th{
    padding:9px 16px; text-align:left; font-size:13px; vertical-align:top;
  }
  table.people th{
    font-size:11px; text-transform:uppercase; color:var(--grey-muted); letter-spacing:.04em;
    border-bottom:1px solid var(--grey-border); font-weight:700;
  }
  table.people tr + tr td{border-top:1px solid var(--grey-bg-alt);}
  table.people .name{font-weight:700;}
  table.people .fn{color:var(--grey-muted);}
  .contact-line{display:flex; flex-direction:column; gap:2px; font-size:12.5px;}
  .contact-line a{color:var(--blue-france); text-decoration:none;}
  .contact-line a:hover{color:var(--blue-france-hover); text-decoration:underline;}
  .contact-line .lbl{color:var(--grey-muted); font-size:11px; width:26px; display:inline-block;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--grey-muted);
  }
  .empty .big{font-size:32px; margin-bottom:6px;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:#D3D3D3; border-radius:6px;}
</style>
</head>
<body>

<header role="banner" class="fr-header">
  <div class="fr-header__body">
    <div class="fr-container">
      <div class="fr-header__body-row">
        <div class="fr-header__brand">
          <div class="fr-header__brand-top">
            <div class="fr-header__logo">
              <p class="fr-logo">Ministère<br>de l'Europe<br>et des Affaires<br>étrangères</p>
              <p class="fr-logo-devise">Liberté<br>Égalité<br>Fraternité</p>
            </div>
          </div>
          <div class="fr-header__service">
            <p class="fr-header__service-title">Annuaire du réseau PresseCom</p>
          </div>
        </div>
        <div class="fr-header__tools">
          <div class="fr-search-bar" role="search">
            <label class="fr-label" for="searchInput">Rechercher</label>
            <input class="fr-input" type="search" id="searchInput" placeholder="Rechercher un nom, un pays, une ville…">
            <button class="fr-btn" title="Rechercher" type="button">Rechercher</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="filters">
    <div class="count" id="countLabel">–</div>

    <div class="filter-block">
      <h3>Groupements</h3>
      <div class="toggle3" id="groupToggles">
        <span class="chip" data-group="G7">G7</span>
        <span class="chip" data-group="G20">G20</span>
        <span class="chip" data-group="UE">UE</span>
      </div>
    </div>

    <div class="filter-block">
      <h3>Zone</h3>
      <div class="chiprow" id="zoneChips"></div>
    </div>

    <div class="filter-block">
      <h3>Pays</h3>
      <div class="combo" id="paysCombo">
        <input type="text" id="paysInput" placeholder="Tous les pays">
        <div class="combo-list" id="paysList"></div>
      </div>
    </div>

    <div class="filter-block">
      <h3>Poste</h3>
      <div class="combo" id="posteCombo">
        <input type="text" id="posteInput" placeholder="Tous les postes">
        <div class="combo-list" id="posteList"></div>
      </div>
    </div>

    <button class="clearbtn" id="clearAll">Réinitialiser les filtres</button>
  </aside>

  <main class="results" id="results">
    <div class="empty"><div class="big">⏳</div>Connexion à Grist…</div>
  </main>
</div>

<script>
// ---------------------------------------------------------------------------
// Column mapping — lets whoever installs this widget map it to their own
// column IDs from the Grist widget configuration panel (gear icon), so it
// keeps working even if columns are renamed.
// ---------------------------------------------------------------------------
grist.ready({
  requiredAccess: 'read table',
  columns: [
    { name: "Poste",       title: "Poste (intitulé du poste)" },
    { name: "Pays",        title: "Pays" },
    { name: "Zone",        title: "Zone" },
    { name: "Ville",       title: "Ville", optional: true },
    { name: "TypePoste",   title: "Type de poste", optional: true },
    { name: "Nom",         title: "Nom" },
    { name: "Prenom",      title: "Prénom", optional: true },
    { name: "Fonction",    title: "Fonction", optional: true },
    { name: "TelFixe",     title: "Tél FIXE", optional: true },
    { name: "TelPortable", title: "Tél PORTABLE", optional: true },
    { name: "TelWhatsapp", title: "Tél WHATSAPP", optional: true },
    { name: "Mail",        title: "mail", optional: true },
    { name: "G7",          title: "G7", optional: true },
    { name: "G20",         title: "G20", optional: true },
    { name: "UE",          title: "UE", optional: true },
  ]
});

let RAW = [];           // mapped records
let state = {
  search: "",
  zone: null,
  pays: null,
  poste: null,
  groups: { G7:false, G20:false, UE:false }
};

grist.onRecords(function(records) {
  RAW = records.map(r => grist.mapColumnNames(r)).filter(Boolean);
  buildZoneChips();
  buildCombo('pays');
  buildCombo('poste');
  render();
});

function norm(v){ return (v===null||v===undefined) ? "" : String(v); }
function truthy(v){ return v === true || v === "true" || v === 1; }

function fieldset(list, key){
  const s = new Set();
  list.forEach(r => { const v = norm(r[key]).trim(); if (v) s.add(v); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b, 'fr'));
}

// -------------------- filter application --------------------
function applyFilters(){
  let rows = RAW;

  if (state.groups.G7)  rows = rows.filter(r => truthy(r.G7));
  if (state.groups.G20) rows = rows.filter(r => truthy(r.G20));
  if (state.groups.UE)  rows = rows.filter(r => truthy(r.UE));

  if (state.zone) rows = rows.filter(r => norm(r.Zone) === state.zone);
  if (state.pays) rows = rows.filter(r => norm(r.Pays) === state.pays);
  if (state.poste) rows = rows.filter(r => norm(r.Poste) === state.poste);

  if (state.search.trim()){
    const q = state.search.trim().toLowerCase();
    rows = rows.filter(r => {
      return [r.Nom, r.Prenom, r.Pays, r.Ville, r.Poste, r.Fonction, r.Mail]
        .map(norm).join(" ").toLowerCase().includes(q);
    });
  }
  return rows;
}

// -------------------- filter UI builders --------------------
function buildZoneChips(){
  const zones = fieldset(RAW, 'Zone');
  const wrap = document.getElementById('zoneChips');
  wrap.innerHTML = "";
  zones.forEach(z => {
    const count = RAW.filter(r => norm(r.Zone) === z).length;
    const chip = document.createElement('span');
    chip.className = 'chip' + (state.zone === z ? ' active' : '');
    chip.innerHTML = z + `<span class="n">${count}</span>`;
    chip.onclick = () => {
      state.zone = (state.zone === z) ? null : z;
      // reset pays if it no longer belongs to selected zone
      if (state.zone && state.pays){
        const stillValid = RAW.some(r => norm(r.Zone)===state.zone && norm(r.Pays)===state.pays);
        if (!stillValid) { state.pays = null; document.getElementById('paysInput').value=""; }
      }
      buildZoneChips();
      buildCombo('pays');
      render();
    };
    wrap.appendChild(chip);
  });
}

function buildCombo(kind){
  const isPays = kind === 'pays';
  const key = isPays ? 'Pays' : 'Poste';
  const input = document.getElementById(isPays ? 'paysInput' : 'posteInput');
  const listEl = document.getElementById(isPays ? 'paysList' : 'posteList');

  // scope pays options to the currently selected zone (if any)
  let scope = RAW;
  if (isPays && state.zone) scope = scope.filter(r => norm(r.Zone) === state.zone);

  const options = fieldset(scope, key);

  function renderList(filterText){
    listEl.innerHTML = "";
    const all = document.createElement('div');
    all.textContent = isPays ? "Tous les pays" : "Tous les postes";
    all.className = (isPays ? state.pays : state.poste) ? "" : "sel";
    all.onclick = () => { setCombo(kind, null); };
    listEl.appendChild(all);

    options
      .filter(o => !filterText || o.toLowerCase().includes(filterText.toLowerCase()))
      .forEach(o => {
        const d = document.createElement('div');
        d.textContent = o;
        if ((isPays ? state.pays : state.poste) === o) d.className = "sel";
        d.onclick = () => setCombo(kind, o);
        listEl.appendChild(d);
      });
  }

  input.oninput = () => { renderList(input.value); listEl.classList.add('open'); };
  input.onfocus = () => { renderList(input.value); listEl.classList.add('open'); };
  input.onblur = () => { setTimeout(()=>listEl.classList.remove('open'), 120); };

  renderList("");
}

function setCombo(kind, value){
  if (kind === 'pays'){
    state.pays = value;
    document.getElementById('paysInput').value = value || "";
    document.getElementById('paysList').classList.remove('open');
  } else {
    state.poste = value;
    document.getElementById('posteInput').value = value || "";
    document.getElementById('posteList').classList.remove('open');
  }
  render();
}

document.querySelectorAll('#groupToggles .chip').forEach(chip => {
  chip.onclick = () => {
    const g = chip.dataset.group;
    state.groups[g] = !state.groups[g];
    chip.classList.toggle('active', state.groups[g]);
    render();
  };
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

document.getElementById('clearAll').onclick = () => {
  state = { search:"", zone:null, pays:null, poste:null, groups:{G7:false,G20:false,UE:false} };
  document.getElementById('searchInput').value = "";
  document.getElementById('paysInput').value = "";
  document.getElementById('posteInput').value = "";
  document.querySelectorAll('#groupToggles .chip').forEach(c => c.classList.remove('active'));
  buildZoneChips();
  buildCombo('pays');
  buildCombo('poste');
  render();
};

// -------------------- rendering --------------------
function contactLine(label, value, href){
  if (!norm(value).trim()) return "";
  const content = href ? `<a href="${href}${value}">${value}</a>` : value;
  return `<span><span class="lbl">${label}</span>${content}</span>`;
}

function render(){
  const rows = applyFilters();
  const resultsEl = document.getElementById('results');
  document.getElementById('countLabel').textContent =
    rows.length + (rows.length === 1 ? " contact" : " contacts");

  if (rows.length === 0){
    resultsEl.innerHTML = `<div class="empty"><div class="big">🔍</div>Aucun contact ne correspond à ces filtres.</div>`;
    return;
  }

  // group by Poste (post = country/city/embassy-consulate)
  const groups = new Map();
  rows.forEach(r => {
    const key = norm(r.Poste) || "(Poste non renseigné)";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const sortedKeys = Array.from(groups.keys()).sort((a,b)=>a.localeCompare(b,'fr'));

  resultsEl.innerHTML = sortedKeys.map(key => {
    const people = groups.get(key);
    const first = people[0];
    const badges = [];
    if (truthy(first.G7)) badges.push('<span class="badge g7">G7</span>');
    if (truthy(first.G20)) badges.push('<span class="badge g20">G20</span>');
    if (truthy(first.UE)) badges.push('<span class="badge ue">UE</span>');

    const sub = [first.Ville, first.TypePoste].filter(v => norm(v).trim()).join(" · ");

    const rowsHtml = people.map(p => {
      const contacts = [
        contactLine("Tél", p.TelFixe),
        contactLine("Mob", p.TelPortable),
        contactLine("WA", p.TelWhatsapp),
        contactLine("✉", p.Mail, "mailto:")
      ].filter(Boolean).join("");
      return `<tr>
        <td class="name">${norm(p.Nom)}${p.Prenom ? " " + norm(p.Prenom) : ""}</td>
        <td class="fn">${norm(p.Fonction)}</td>
        <td><div class="contact-line">${contacts || "—"}</div></td>
      </tr>`;
    }).join("");

    return `<div class="group">
      <div class="group-head">
        <span class="post-title">${norm(first.Pays)} — ${key}</span>
        <span class="post-sub">${sub}</span>
        <span class="badges">${badges.join("")}</span>
      </div>
      <table class="people">
        <thead><tr><th>Nom</th><th>Fonction</th><th>Contact</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
